# docker compose up --build
#   1. `pipeline` runs once: simulate -> ingest -> dbt build -> train -> score
#   2. `api` and `dashboard` start once the pipeline has completed successfully
x-app: &app
  build: .
  image: saas-revenue-intelligence:latest
  volumes:
    - warehouse:/app/data
    - artifacts:/app/artifacts

services:
  pipeline:
    <<: *app
    command: ["revintel", "all"]

  api:
    <<: *app
    command: ["uvicorn", "revintel.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      pipeline: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    <<: *app
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0",
              "--server.headless=true"]
    ports: ["8501:8501"]
    depends_on:
      pipeline: { condition: service_completed_successfully }

volumes:
  warehouse:
  artifacts:
