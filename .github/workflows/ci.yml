name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install ruff==0.17.5
      - run: ruff check src tests dashboard

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Unit + end-to-end tests
        run: pytest --cov=revintel --cov-report=term-missing

  pipeline:
    # Full-scale run: proves the whole stack (ingest -> dbt build + tests -> ML) works on every push
    runs-on: ubuntu-latest
    needs: test
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt && pip install --no-deps -e .
      - run: revintel all
      - name: Re-run ingestion (must be idempotent)
        run: revintel ingest
      - name: Generate dbt docs
        run: cd dbt && dbt docs generate --profiles-dir .
      - uses: actions/upload-artifact@v4
        with:
          name: model-report
          path: |
            artifacts/model/metrics.json
            artifacts/model/lift_table.csv
            artifacts/charts/
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t saas-revenue-intelligence:ci .
