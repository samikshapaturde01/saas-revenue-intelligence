version: 2

models:
  - name: int_subscription_periods
    description: Validity windows for each subscription state (valid_from inclusive, valid_to exclusive).
    columns:
      - name: event_id
        data_tests: [unique, not_null]

  - name: int_month_spine
    description: One row per calendar month in the data range.
    columns:
      - name: month_start
        data_tests: [unique, not_null]

  - name: int_account_mrr_monthly
    description: Month-end MRR per account, densified (0 while churned) from first subscription month onward.
    data_tests:
      - unique_combination: { arguments: { columns: [account_id, month_start] } }
    columns:
      - name: mrr_usd
        data_tests: [not_null, non_negative]

  - name: int_usage_monthly
    description: Product usage aggregated to account-month.
    data_tests:
      - unique_combination: { arguments: { columns: [account_id, month_start] } }

  - name: int_support_monthly
    description: Support activity aggregated to account-month.
    data_tests:
      - unique_combination: { arguments: { columns: [account_id, month_start] } }

  - name: int_billing_monthly
    description: Invoicing and payment outcomes aggregated to account-month.
    data_tests:
      - unique_combination: { arguments: { columns: [account_id, month_start] } }
