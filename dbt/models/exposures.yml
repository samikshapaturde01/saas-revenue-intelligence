version: 2

exposures:
  - name: customer_health_dashboard
    label: Customer Health Dashboard
    type: dashboard
    maturity: high
    url: http://localhost:8501
    description: Streamlit dashboard used by Customer Success to track revenue KPIs and at-risk accounts.
    depends_on:
      - ref('metrics_mrr_monthly')
      - ref('fct_cohort_retention')
      - ref('dim_accounts')
    owner: { name: Samiksha Paturde }

  - name: churn_risk_api
    label: Churn Risk Scoring API
    type: application
    maturity: medium
    url: http://localhost:8000/docs
    description: FastAPI service serving churn probabilities and revenue-at-risk to the CRM.
    depends_on:
      - ref('mart_churn_features')
      - ref('dim_accounts')
    owner: { name: Samiksha Paturde }
