name: revintel
version: "1.0.0"
config-version: 2
profile: revintel

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  annual_billing_discount: 0.15
  churn_horizon_months: 3

models:
  revintel:
    +persist_docs: { relation: true, columns: true }
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  revintel:
    +schema: reference

data_tests:
  +severity: error
